<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Contas de campanha 2026</title>
<style>
:root{
  --bg:#f3f5f8; --sf:#ffffff; --sf2:#e9edf3; --ink:#0f1720; --mut:#576374; --b:#d9dfe7;
  --ac:#17538c; --acsf:#e6eefa; --acink:#ffffff;
  --am:#845400; --amsf:#fbf0d9; --amb:#e4cb98;
  --sl:#47586c; --slsf:#e7ecf2; --slb:#cdd7e1;
  --pub:#1a6b66; --pubsf:#dfeeed;
  --fc:#0a5ec4;
  --raio:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1116; --sf:#151b22; --sf2:#1e262f; --ink:#e7edf4; --mut:#9dabbb; --b:#2a333d;
    --ac:#7fb4ef; --acsf:#16273a; --acink:#0d1116;
    --am:#e6b165; --amsf:#302512; --amb:#54411d;
    --sl:#a6b6c8; --slsf:#1c242d; --slb:#333e4a;
    --pub:#5cbcb2; --pubsf:#132a29;
    --fc:#8cc4ff;
  }
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.35;padding-bottom:84px;
}
@media(min-width:720px){body{padding-bottom:60px}}
h1,h2,h3{margin:0;font-size:1em;font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--ac)}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--fc);outline-offset:1px;border-radius:6px}
.pular{position:absolute;left:-9999px;top:0;background:var(--sf);padding:10px;z-index:99}
.pular:focus{left:8px;top:8px}

/* cabecalho */
header{position:sticky;top:0;z-index:30;background:var(--sf);border-bottom:1px solid var(--b)}
.hwrap{max-width:1180px;margin:0 auto;padding:5px 10px 6px}
.linha1{display:flex;gap:6px;align-items:center}
#chipuf .chip{padding:0 12px;font-weight:700}
.busca{position:relative;flex:1;min-width:0}
.busca input{
  width:100%;height:44px;padding:0 42px 0 32px;border:1px solid var(--b);border-radius:var(--raio);
  background:var(--bg);color:var(--ink);font-size:14.5px;
}
.busca input::placeholder{color:var(--mut)}
.busca input::-webkit-search-cancel-button{display:none}
.lupa{position:absolute;left:10px;top:13px;width:16px;height:16px;fill:none;stroke:var(--mut);stroke-width:2;pointer-events:none}
.limpaq{position:absolute;right:0;top:0;width:42px;height:44px;border-radius:8px;color:var(--mut);font-size:16px}
.ajuda{width:44px;height:44px;border:1px solid var(--b);border-radius:var(--raio);color:var(--mut);flex:none;font-size:17px}
.abas{display:flex;gap:4px;background:var(--sf2);padding:2px;border-radius:var(--raio)}
.abas button{flex:1;min-height:44px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--mut)}
.abas button[aria-current="page"]{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{
  display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 9px;
  border:1px solid var(--b);border-radius:22px;background:var(--bg);font-size:13px;color:var(--ink);
  max-width:100%;overflow:hidden;
}
.chip>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .k{color:var(--mut)}
.chip .seta{font-size:9px;color:var(--mut)}
.chip[data-on="1"]{background:var(--acsf);border-color:var(--ac);color:var(--ac)}
.chip[data-on="1"] .k,.chip[data-on="1"] .seta{color:var(--ac)}
.chip.limpar{border-style:dashed;color:var(--mut)}
.chip:active{background:var(--sf2)}

main{max-width:1180px;margin:0 auto;padding:10px}
.wrap{display:grid;gap:10px;align-items:start;grid-template-columns:minmax(0,1fr)}
.wrap>*{min-width:0}
@media(min-width:960px){
  .wrap{grid-template-columns:minmax(0,1fr) 336px;grid-template-areas:"lista lado"}
  .lista{grid-area:lista}
  .lado{grid-area:lado;position:sticky;top:calc(var(--hh,132px) + 10px)}
}
.cartao{background:var(--sf);border:1px solid var(--b);border-radius:var(--raio);overflow:hidden;min-width:0}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--b)}
.cab h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.cab .acao{font-size:12px;color:var(--ac);font-weight:600;min-height:30px;padding:0 4px}

/* resumo */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--b)}
@media(min-width:520px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sf);padding:8px 10px;min-width:0}
.tile .r{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:17px;font-weight:700;margin-top:1px;white-space:nowrap}
.tile .n{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.tile.pub .v{color:var(--pub)}
.tile.sin .v{color:var(--ink)}
.abre{padding:9px 12px;font-size:13px;line-height:1.35;border-bottom:1px solid var(--b)}
.abre b{font-weight:700}

.bar{height:6px;background:var(--sf2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.bar.p i{background:var(--pub)}

/* listas densas */
ul.l{list-style:none;margin:0;padding:0}
.row{position:relative;border-bottom:1px solid var(--b)}
.row:last-child{border-bottom:0}
.rowmain{
  display:grid;grid-template-columns:24px minmax(0,1fr) auto;
  grid-template-areas:"pos nome val" "pos meta meta" "pos pub pub";
  gap:1px 8px;padding:8px 12px 9px;text-decoration:none;color:inherit;
}
.rowmain:active{background:var(--sf2)}
@media(hover:hover){.rowmain:hover{background:var(--sf2)}}
/* o cartao recorta o que passa da borda: o anel de foco desenha por dentro */
.rowmain:focus-visible,.mais:focus-visible{outline-offset:-3px;border-radius:0}
.r-pos{grid-area:pos;font-size:11px;color:var(--mut);padding-top:3px}
.r-nome{grid-area:nome;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r-val{grid-area:val;font-weight:700;font-size:14.5px;white-space:nowrap}
.r-meta{grid-area:meta;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r-pub{grid-area:pub;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);margin-top:2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-pub .bar{width:44px;flex:none}
.nomegrande{display:block;font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
/* os selos ficam na propria linha, fora do link: ninguem mira num alvo por cima de outro */
.selos{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:0 12px 9px;margin-top:-3px}
.row[data-selos] .rowmain{padding-bottom:3px}
.selo{
  position:relative;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:700;
  background:var(--slsf);color:var(--sl);border:1px solid var(--slb);
}
/* area de toque de 44px sem engordar o desenho */
.selos .selo::after{content:"";position:absolute;top:-10px;bottom:-10px;left:-3px;right:-3px}
.selo[data-g="2"]{background:var(--amsf);color:var(--am);border-color:var(--amb)}
.selo[data-g="3"]{background:var(--am);color:var(--sf);border-color:var(--am)}
.prop{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);opacity:.35;pointer-events:none;border-radius:0 2px 2px 0}

.status{margin:0;padding:0 12px;min-height:44px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;gap:8px}
.status>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .ordbt{min-height:44px;padding:0 2px;color:var(--ac);font-weight:600;font-size:12px;text-align:right;white-space:nowrap}
.vazio{padding:26px 16px;text-align:center;color:var(--mut);font-size:13.5px}
.vazio .bt{margin-top:12px}
.bt{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;
  border:1px solid var(--b);border-radius:var(--raio);background:var(--sf);font-size:13.5px;font-weight:600;
}
.bt.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.mais{display:block;width:100%;min-height:46px;font-size:13.5px;font-weight:600;color:var(--ac);border-top:1px solid var(--b)}
.mais:active{background:var(--sf2)}

/* esqueleto e erro */
.sk{padding:10px 12px;border-bottom:1px solid var(--b)}
.sk i{display:block;height:11px;border-radius:5px;background:var(--sf2);margin-bottom:6px}
.sk i:nth-child(1){width:62%} .sk i:nth-child(2){width:38%} .sk i:nth-child(3){width:48%;margin-bottom:0}
@media (prefers-reduced-motion:no-preference){.sk i{animation:pulso 1.3s ease-in-out infinite}}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.45}}
.erro{padding:22px 16px;text-align:center}
.erro p{margin:0 0 12px;font-size:13.5px;color:var(--mut)}

/* tipos e barras rotuladas */
.blist{margin:0;padding:4px 12px 10px;list-style:none;min-width:0}
.blist li{padding:2px 0;min-width:0}
.blist .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.blist .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.blist .t b{font-weight:700;white-space:nowrap}
.blist button.t{width:100%;text-align:left;min-height:44px}
.blist li[aria-current="true"] .t{color:var(--ac)}

/* ficha */
.voltar{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 6px;font-size:13.5px;font-weight:600;color:var(--ac);margin-bottom:6px}
.fhead{padding:12px}
.fhead h1{font-size:19px;line-height:1.2}
.fhead .sub{font-size:13px;color:var(--mut);margin-top:4px}
.fgrid{display:grid;gap:10px}
@media(min-width:900px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .full{grid-column:1/-1}}
.dest{padding:12px;background:var(--pubsf);border-top:1px solid var(--b)}
.dest .g{font-size:26px;font-weight:800;color:var(--pub);line-height:1.1}
.dest .d{font-size:12.5px;color:var(--mut);margin-top:3px}

/* comparacao com quem disputa o mesmo cargo na mesma UF */
.pares{padding:10px 12px;border-top:1px solid var(--b)}
.pares .fr{font-size:13px;color:var(--ink)}
.pares .fr b{font-weight:700}
.pares .rv{position:relative;height:30px;margin:12px 0 4px}
.pares .eixo{position:absolute;left:0;right:0;top:13px;height:4px;background:var(--sf2);border-radius:2px}
.pares .mc{position:absolute;top:6px;width:2px;height:18px;background:var(--mut);opacity:.7}
.pares .eu{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid var(--sf);box-shadow:0 0 0 1px var(--ac)}
.pares .leg{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut)}
.pares .rs{font-size:11.5px;color:var(--mut);margin-top:6px}
.sinal{padding:10px 12px;border-bottom:1px solid var(--b)}
.sinal:last-child{border-bottom:0}
.sinal .top{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.sinal .tx{font-size:13px;color:var(--ink)}
.sinal .nao{margin-top:10px;font-size:12.5px;font-weight:600;color:var(--ac);min-height:44px;text-align:left}
.grav{font-size:11px;color:var(--mut)}
.pontos i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sf2);margin-right:2px;border:1px solid var(--slb)}
.pontos i.on{background:var(--am);border-color:var(--am)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 12px;font-size:13px}
.kv .k{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .v{font-weight:600;text-align:right;white-space:nowrap}
.forn{padding:8px 12px;border-bottom:1px solid var(--b)}
.forn:last-child{border-bottom:0}
.forn .n1{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.forn .n1 b{white-space:nowrap}
.forn .n1 .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.forn .n2{font-size:11.5px;color:var(--mut);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{display:inline-block;padding:1px 5px;border-radius:5px;background:var(--sf2);font-size:10.5px;font-weight:700;color:var(--mut);border:1px solid var(--b)}
.tag.pj{background:var(--acsf);color:var(--ac);border-color:var(--acsf)}
svg.serie{display:block;width:100%;height:88px;background:var(--sf)}
svg.serie rect{fill:var(--ac);opacity:.8}
details{border-top:1px solid var(--b)}
details summary{min-height:44px;display:flex;align-items:center;padding:0 12px;font-size:12.5px;color:var(--ac);font-weight:600;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.nota{padding:10px 12px;font-size:12.5px;color:var(--mut);background:var(--sf)}
.nota b{color:var(--ink)}

/* folha (sheet) */
.fundo{position:fixed;inset:0;background:rgba(6,10,16,.5);z-index:40}
.folha{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sf);
  border-radius:16px 16px 0 0;max-height:82vh;display:flex;flex-direction:column;
  box-shadow:0 -6px 24px rgba(0,0,0,.25);
}
@media(min-width:720px){
  .folha{left:50%;right:auto;bottom:auto;top:12vh;transform:translateX(-50%);width:520px;max-width:94vw;border-radius:14px;max-height:76vh}
}
.fcab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid var(--b)}
.fcab h2{font-size:15px}
.fcab button{width:44px;height:44px;border-radius:8px;color:var(--mut);font-size:16px;flex:none}
.fcorpo{overflow-y:auto;padding:6px 0 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.opt{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 14px;text-align:left;font-size:14px}
.opt:active{background:var(--sf2)}
.opt .c{font-size:12px;color:var(--mut);white-space:nowrap}
.opt[aria-pressed="true"]{color:var(--ac);font-weight:700;background:var(--acsf)}
.filtro{margin:6px 12px 8px;width:calc(100% - 24px);height:40px;padding:0 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--ink)}
.fcorpo p{margin:0;padding:8px 14px;font-size:13.5px}
.fcorpo p.rot{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-bottom:0;padding-top:12px}
.fcorpo .selo{margin:0 14px}
.tecla{display:flex;justify-content:space-between;gap:10px;padding:6px 14px;font-size:13px}
.tecla kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;background:var(--sf2);border:1px solid var(--b);border-radius:5px;padding:1px 5px}

footer{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--b);
  padding:4px 8px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));
}
.fwrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:2px}
.legal{margin:0;font-size:10.5px;line-height:1.25;color:var(--mut);text-align:center}
.legal b{color:var(--ink);font-weight:600}
.legalbt{font-size:inherit;color:var(--ac);font-weight:600;text-decoration:underline;min-height:26px;padding:0 2px}
.legalbt[disabled]{color:var(--mut);text-decoration:none;cursor:default}
.ajuda[disabled]{opacity:.45;cursor:default}
@media(min-width:720px){
  .fwrap{flex-direction:row;align-items:center;gap:12px}
  .abas{width:330px;flex:none}
  .legal{flex:1;text-align:right;font-size:11px}
}
.ocul{display:none}
.ocultavisual{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.nota{padding:8px 12px;font-size:12px}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header>
  <div class="hwrap">
    <div class="linha1">
      <span id="chipuf"></span>
      <div class="busca">
        <svg class="lupa" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M13.5 13.5 18 18"></path></svg>
        <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false"
               placeholder="Buscar nome ou número" aria-label="Buscar candidatura por nome ou número">
        <button class="limpaq ocul" id="limpaq" data-act="limpaq" aria-label="Limpar a busca">✕</button>
      </div>
      <button class="ajuda" id="btajuda" data-act="ajuda" disabled
              aria-label="Ajuda, legenda dos sinais, contato e atalhos de teclado">?</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<!-- o rodape vem antes do conteudo no DOM, e o CSS o fixa embaixo: quem navega por
     teclado alcanca as secoes sem atravessar a lista inteira -->
<footer id="rodape">
  <div class="fwrap">
    <nav class="abas" aria-label="Seções do painel">
      <button id="ab-ranking" data-act="aba" data-v="ranking" aria-current="page">Ranking</button>
      <button id="ab-alarmes" data-act="aba" data-v="alarmes">Sinais</button>
      <button id="ab-fornecedores" data-act="aba" data-v="fornecedores">Dinheiro</button>
    </nav>
    <p class="legal">Fonte: TSE, dados abertos da prestação de contas 2026 · dados de <b id="dtger">carregando</b> · sinal automático, não é conclusão sobre ninguém · <button class="legalbt" id="btajuda2" data-act="ajuda" disabled>contato e metodologia</button></p>
  </div>
</footer>

<main id="conteudo" tabindex="-1"></main>

<div id="folha"></div>

<script>
(function(){
"use strict";

/* ---------- utilidades ---------- */
var D = './dados/';
var REPO = 'https://github.com/guipfranco/contas2026';
var cache = Object.create(null);

function get(caminho){
  if(cache[caminho]) return cache[caminho];
  var p = fetch(D + caminho, {cache:'no-cache'}).then(function(r){
    if(!r.ok){
      var e = new Error('HTTP ' + r.status);
      e.status = r.status;   /* 404 nao e queda de rede, e dado que nao existe */
      throw e;
    }
    return r.json();
  })['catch'](function(e){ delete cache[caminho]; throw e; });
  cache[caminho] = p;
  return p;
}
/* guarda so o arquivo da UF em uso: navegar por muitos estados nao pode encher a memoria do aparelho */
function limparCacheUF(manter){
  Object.keys(cache).forEach(function(k){
    if(k.indexOf('uf/') === 0 && k !== 'uf/' + manter + '.json') delete cache[k];
  });
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nm(x){
  return x >= 100 ? Math.round(x).toLocaleString('pt-BR')
                  : x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
}
function moeda(c){
  if(c == null || isNaN(c)) return 'não declarado';
  var neg = c < 0 ? '-' : '', v = Math.abs(c) / 100;
  if(v >= 999500000) return neg + 'R$ ' + nm(v/1e9) + ' bi';
  if(v >= 999500)    return neg + 'R$ ' + nm(v/1e6) + ' mi';
  if(v >= 999.5)     return neg + 'R$ ' + nm(v/1e3) + ' mil';
  return neg + 'R$ ' + Math.round(v).toLocaleString('pt-BR');
}
function moedaCheia(c){
  if(c == null || isNaN(c)) return 'não declarado';
  return 'R$ ' + (c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function inteiro(n){ return (n||0).toLocaleString('pt-BR'); }
function pct(a,b){ return b > 0 ? Math.round(a / b * 100) : 0; }
function norm(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
}
function dataBR(iso){
  if(!iso || iso.length < 10) return '';
  return iso.slice(8,10) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4);
}
function diaMes(iso){ return iso ? iso.slice(8,10) + '/' + iso.slice(5,7) : ''; }
function cargoCurto(c){
  return String(c||'').replace(/^Deputado /,'Dep. ');
}
function fedCurta(f){
  return String(f||'').replace(/^FEDERAÇÃO /,'').replace(/^FEDERACAO /,'');
}

/* ---------- estado ---------- */
var META = null, UFD = null, IDX = null, ALA = null, FOR = null, COTA = null;
var S = {
  view:'ranking', uf:'SP', cargo:'', partido:'', fed:'', ord:'contratado',
  sinal:'', tipo:'', q:'', cand:'', grav:'', fam:'', auf:'', fo:'valor', limite:60
};
var ORDS = {contratado:'gasto contratado', pago:'gasto pago', receita:'receita declarada',
            sinais:'quantidade de sinais a conferir'};
var COLS = {contratado:6, pago:7, receita:8, sinais:12};
var FAMS = {A:'fornecedor', B:'doador', C:'candidato', D:'ritmo'};
/* a mesma ressalva em toda tela onde o sinal vira a metrica principal */
var NOTA_SINAL = '<div class="nota">Cada sinal é um <b>padrão automático</b> que vale conferir no dado ' +
  'declarado, nunca uma acusação. Toque em <b>o que isso não significa</b> antes de tirar conclusão. ' +
  'Quem presta serviço a uma campanha não faz parte dela: o fornecedor citado no texto de um sinal é ' +
  '<b>terceiro</b>, e tem o mesmo direito de pedir correção.</div>';
var UFNOME = {
  AC:'no Acre', AL:'em Alagoas', AM:'no Amazonas', AP:'no Amapá', BA:'na Bahia',
  CE:'no Ceará', DF:'no Distrito Federal', ES:'no Espírito Santo', GO:'em Goiás',
  MA:'no Maranhão', MG:'em Minas Gerais', MS:'no Mato Grosso do Sul', MT:'no Mato Grosso',
  PA:'no Pará', PB:'na Paraíba', PE:'em Pernambuco', PI:'no Piauí', PR:'no Paraná',
  RJ:'no Rio de Janeiro', RN:'no Rio Grande do Norte', RO:'em Rondônia', RR:'em Roraima',
  RS:'no Rio Grande do Sul', SC:'em Santa Catarina', SE:'em Sergipe', SP:'em São Paulo',
  TO:'no Tocantins'
};
function ondeUF(uf){ return UFNOME[uf] || ('em ' + uf); }
/* um erro por fonte: sucesso numa aba nao pode apagar a falha de outra */
var erros = {uf:null, indice:null, alarmes:null, forn:null, cota:null, cand:null};
var pendente = false, ultimaChave = '', primeiroRender = true, avisoDic = '';
var tiposAberto = null, ufEmVoo = '';

function lerHash(){
  var h = location.hash.replace(/^#/,''), o = {};
  h.split('&').forEach(function(seg){
    if(!seg) return;
    var i = seg.indexOf('=');
    var d = function(x){ try{ return decodeURIComponent(x.replace(/\+/g,' ')); }catch(e){ return x; } };
    if(i < 0) o[d(seg)] = ''; else o[d(seg.slice(0,i))] = d(seg.slice(i+1));
  });
  return o;
}
function aplicarHash(){
  var o = lerHash();
  S.uf = (o.uf || S.uf || 'SP').toUpperCase();
  if(META && !META.ufs[S.uf]) S.uf = Object.keys(META.ufs)[0];
  S.cargo = o.cargo || ''; S.partido = o.partido || ''; S.fed = o.fed || '';
  S.ord = ORDS[o.ord] ? o.ord : 'contratado';
  S.sinal = o.sinal || ''; S.tipo = o.tipo || ''; S.q = o.q || '';
  S.cand = /^[0-9]{6,20}$/.test(o.cand || '') ? o.cand : '';
  S.grav = o.grav || ''; S.fam = o.fam || ''; S.auf = (o.auf || '').toUpperCase();
  S.fo = ({valor:1,candidatos:1,cota:1}[o.fo]) ? o.fo : 'valor';
  S.view = S.cand ? 'cand'
        : (S.q ? 'busca'
        : (('sinais' in o || 'alarmes' in o) ? 'alarmes'
        : ('fornecedores' in o ? 'fornecedores' : 'ranking')));
  S.limite = 60;
}
function montarHash(){
  var p = [], e = encodeURIComponent;
  function add(k,v,padrao){ if(v && v !== padrao) p.push(k + '=' + e(v)); }
  if(S.view === 'alarmes'){
    /* o link diz 'sinais', que e a palavra da tela; 'alarmes' continua valendo na entrada */
    p.push('sinais'); add('grav',S.grav); add('fam',S.fam); add('auf',S.auf);
    return p.join('&');
  }
  if(S.view === 'fornecedores'){
    p.push('fornecedores'); add('fo',S.fo,'valor');
    return p.join('&');
  }
  add('uf',S.uf); add('cargo',S.cargo); add('partido',S.partido); add('fed',S.fed);
  add('ord',S.ord,'contratado'); add('sinal',S.sinal); add('tipo',S.tipo);
  if(S.view === 'busca') add('q',S.q);
  if(S.view === 'cand') add('cand',S.cand);
  return p.join('&');
}
function ir(patch, modo){
  if(patch) for(var k in patch) S[k] = patch[k];
  if(!patch || !('limite' in patch)) S.limite = 60;
  var h = '#' + montarHash();
  if(modo === 'substituir'){
    try{ history.replaceState(null,'',h); }catch(e){ }
    render();
  } else {
    if(location.hash === h){ render(); }
    else {
      pendente = true;
      location.hash = h;
      setTimeout(function(){ if(pendente){ pendente = false; render(); } }, 60);
    }
  }
}
window.addEventListener('hashchange', function(){
  pendente = false;
  aplicarHash();
  render();
});

/* ---------- folha (sheet) ---------- */
var folha = document.getElementById('folha'), focoAnterior = null;
function folhaAberta(){ return folha.childNodes.length > 0; }
function abrirFolha(titulo, corpo){
  focoAnterior = document.activeElement;
  folha.innerHTML =
    '<div class="fundo" data-act="fecharfolha"></div>' +
    '<div class="folha" role="dialog" aria-modal="true" aria-labelledby="ftit">' +
      '<div class="fcab"><h2 id="ftit">' + esc(titulo) + '</h2>' +
      '<button data-act="fecharfolha" aria-label="Fechar">✕</button></div>' +
      '<div class="fcorpo">' + corpo + '</div>' +
    '</div>';
  var alvo = folha.querySelector('.filtro') || folha.querySelector('.fcorpo [aria-pressed="true"]') ||
             folha.querySelector('.fcorpo button, .fcorpo a') || folha.querySelector('.fcab button');
  if(alvo) alvo.focus();
}
function fecharFolha(){
  if(!folhaAberta()) return;
  folha.innerHTML = '';
  if(focoAnterior && focoAnterior.focus) focoAnterior.focus();
  focoAnterior = null;
}
folha.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ e.preventDefault(); fecharFolha(); return; }
  if(e.key !== 'Tab') return;
  var f = folha.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  var pri = f[0], ult = f[f.length-1];
  if(e.shiftKey && document.activeElement === pri){ e.preventDefault(); ult.focus(); }
  else if(!e.shiftKey && document.activeElement === ult){ e.preventDefault(); pri.focus(); }
});
folha.addEventListener('input', function(e){
  if(!e.target.classList.contains('filtro')) return;
  var t = norm(e.target.value);
  folha.querySelectorAll('.opt').forEach(function(b){
    b.style.display = (!t || norm(b.textContent).indexOf(t) >= 0) ? '' : 'none';
  });
});

function opcoes(chave, itens, atual){
  var h = itens.length > 10 ? '<input class="filtro" type="search" placeholder="filtrar a lista" aria-label="Filtrar a lista">' : '';
  h += itens.map(function(it){
    var sel = String(it.v) === String(atual);
    return '<button class="opt" data-act="opt" data-k="' + chave + '" data-v="' + esc(it.v) + '" aria-pressed="' + sel + '">' +
           '<span>' + esc(it.r) + '</span>' + (it.c ? '<span class="c">' + esc(it.c) + '</span>' : '') + '</button>';
  }).join('');
  return h;
}
/* O catalogo casa PELO CODIGO, nunca por posicao numa lista: aviso trocado seria
   a ressalva de um sinal ao lado do texto de outro, e a ressalva e a peca que
   impede o sinal de virar acusacao. Formato novo: META.sinais[cod]. Formato
   antigo (lista de frases): so vale se a frase comecar pelo proprio codigo. */
var MARCA_NAO = /O que N[ÃA]O significa:\s*/i;
function sinalDe(cod){
  if(!META || !cod) return null;
  var s = META.sinais && META.sinais[cod];
  if(s && s.significa){
    return {significa:s.significa, nao:s.nao_significa || '', nome:s.nome || '',
            familia:s.familia || FAMS[cod.charAt(0)] || ''};
  }
  var lista = (META.dic && META.dic.alarme) || [], avisos = META.avisos || [];
  var i = lista.indexOf(cod);
  var txt = (i >= 0 && avisos[i]) ? String(avisos[i]) : '';
  if(txt.indexOf(cod + ':') !== 0) return null;      /* fora de sincronia: nao chuta */
  txt = txt.slice(cod.length + 1);
  var m = txt.match(MARCA_NAO), nao = '';
  if(m){ nao = txt.slice(m.index + m[0].length); txt = txt.slice(0, m.index); }
  return {significa:txt.trim(), nao:nao.trim(), nome:'', familia:FAMS[cod.charAt(0)] || ''};
}
function abrirAviso(cod){
  var s = sinalDe(cod), corpo = '';
  if(!s){
    corpo = '<p>A explicação deste sinal não veio nesta versão dos dados, então ela não pode ser ' +
      'mostrada aqui. Sem a explicação, o sinal não sustenta conclusão nenhuma: trate como aviso de que ' +
      'vale conferir a prestação de contas na fonte, no TSE.</p>';
    abrirFolha('Sinal ' + cod, corpo);
    return;
  }
  corpo += '<p class="rot">O que o sinal aponta</p><p>' + esc(s.significa) + '</p>';
  corpo += '<p class="rot">O que isso não significa</p><p>' +
    (s.nao ? esc(s.nao) : 'A ressalva deste sinal não veio nesta versão dos dados. Um sinal sozinho não conclui nada.') + '</p>';
  corpo += '<p class="rot">Família</p><p>' + esc(s.familia) + '</p>';
  corpo += '<p class="rot">Lembrete</p><p>O sinal é automático, calculado a partir do que foi declarado ao TSE. ' +
           'Ele serve para conferir, não conclui nada sobre ninguém. Quem é apontado pode pedir correção: ' +
           'veja <b>contato e metodologia</b> na ajuda.</p>';
  abrirFolha('Sinal ' + cod + (s.nome ? ' · ' + s.nome : ''), corpo);
}

/* ---------- selos de sinal ---------- */
function selosDe(lista){
  var m = {}, ordem = [];
  lista.forEach(function(a){
    var cod = META.dic.alarme[a[0]] || '?', g = a[1] || 1;
    if(!m[cod]){ m[cod] = {g:g, n:0}; ordem.push(cod); }
    m[cod].n++; if(g > m[cod].g) m[cod].g = g;
  });
  ordem.sort(function(a,b){ return m[b].g - m[a].g; });
  return ordem.slice(0,3).map(function(cod){
    var o = m[cod], c = esc(cod);
    return '<button class="selo" data-g="' + o.g + '" data-act="aviso" data-cod="' + c + '" ' +
      'aria-label="Sinal ' + c + ', intensidade ' + o.g + ' de 3' + (o.n>1 ? ', ' + o.n + ' ocorrências' : '') +
      '. Ver o que significa e o que não significa">' + c + (o.n > 1 ? '·' + o.n : '') + '</button>';
  }).join('');
}
function pontos(g){
  var n = (typeof g === 'number' && g >= 1 && g <= 3) ? Math.round(g) : 0;
  if(!n) return '<span class="grav">intensidade não informada</span>';
  var h = '';
  for(var i=1;i<=3;i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
  var rot = (META && META.gravidades && META.gravidades[n]) ? ' · ' + META.gravidades[n] : '';
  return '<span class="pontos" aria-hidden="true">' + h + '</span><span class="grav">intensidade ' +
         n + ' de 3' + esc(rot) + '</span>';
}

/* ---------- filtros sobre a UF ---------- */
function codigosDaLinha(r){
  return r[12].map(function(a){ return META.dic.alarme[a[0]] || ''; });
}
function passa(r, ignorar){
  if(S.cargo && r[4] !== S.cargo) return false;
  if(S.partido && META.dic.partido[r[3]] !== S.partido) return false;
  if(S.fed && (META.dic.fed[r[5]] || '') !== S.fed) return false;
  if(S.sinal && ignorar !== 'sinal'){
    var cods = codigosDaLinha(r);
    if(S.sinal === 'com'){ if(!cods.length) return false; }
    else if(S.sinal.length === 1){
      if(!cods.some(function(c){ return c.charAt(0) === S.sinal; })) return false;
    } else if(cods.indexOf(S.sinal) < 0) return false;
  }
  if(S.tipo !== '' && ignorar !== 'tipo'){
    var ti = +S.tipo;
    if(!r[11].some(function(t){ return t[0] === ti; })) return false;
  }
  return true;
}
function valorTipo(r){
  var ti = +S.tipo, v = 0;
  r[11].forEach(function(t){ if(t[0] === ti) v = t[1]; });
  return v;
}
function valorDe(r){
  if(S.tipo !== '') return valorTipo(r);
  if(S.ord === 'sinais') return r[12].length;
  return r[COLS[S.ord]];
}
function filtradas(){
  if(!UFD) return [];
  var l = UFD.c.filter(function(r){ return passa(r); });
  l.sort(function(a,b){
    var d = valorDe(b) - valorDe(a);
    return d !== 0 ? d : b[6] - a[6];
  });
  return l;
}

/* ---------- cabeçalho: chips ---------- */
function chip(act, rotulo, valor, ligado){
  var txt = ligado && valor ? valor : rotulo;
  return '<button class="chip" data-act="' + act + '" data-on="' + (ligado ? 1 : 0) + '" aria-haspopup="dialog" ' +
    'aria-label="' + esc(rotulo) + ': ' + esc(valor || 'todos') + '. Tocar para escolher">' +
    '<span>' + esc(txt) + '</span><span class="seta" aria-hidden="true">▾</span></button>';
}
function renderChips(){
  var c = document.getElementById('chips'), cu = document.getElementById('chipuf'), h = '';
  if(!META){ c.innerHTML = ''; cu.innerHTML = ''; return; }
  if(S.view === 'alarmes'){
    cu.innerHTML = chip('f-auf','UF dos sinais', S.auf || 'Brasil', true);
    h += chip('f-grav','Intensidade', S.grav ? 'força ' + S.grav + ' de 3' : 'todas', !!S.grav);
    h += chip('f-fam','Família', S.fam ? (S.fam.length === 1 ? S.fam + ' ' + (FAMS[S.fam]||'') : S.fam) : 'todas', !!S.fam);
    if(S.auf || S.grav || S.fam) h += '<button class="chip limpar" data-act="limpar">limpar ✕</button>';
  } else if(S.view === 'fornecedores'){
    cu.innerHTML = '';
    h += '<button class="chip" data-act="fo" data-v="valor" data-on="' + (S.fo==='valor'?1:0) + '">Quem recebeu</button>';
    h += '<button class="chip" data-act="fo" data-v="candidatos" data-on="' + (S.fo==='candidatos'?1:0) + '">Quem atende mais</button>';
    h += '<button class="chip" data-act="fo" data-v="cota" data-on="' + (S.fo==='cota'?1:0) + '">Cota</button>';
  } else {
    cu.innerHTML = chip('f-uf','Estado', S.uf, true);
    h += chip('f-cargo','Cargo', S.cargo ? cargoCurto(META.cargos[S.cargo] || S.cargo) : '', !!S.cargo);
    h += chip('f-partido','Partido', S.partido, !!S.partido);
    h += chip('f-fed','Federação', S.fed ? fedCurta(S.fed) : '', !!S.fed);
    h += chip('f-sinal','Sinais', S.sinal ? (S.sinal === 'com' ? 'com sinal' : S.sinal) : '', !!S.sinal);
    if(S.tipo !== '') h += '<button class="chip" data-on="1" data-act="limpatipo">' + esc(META.dic.tipo[+S.tipo] || '') + ' ✕</button>';
    if(S.cargo || S.partido || S.fed || S.sinal || S.tipo !== '' || S.ord !== 'contratado')
      h += '<button class="chip limpar" data-act="limpar">limpar ✕</button>';
  }
  c.innerHTML = h;
  document.querySelectorAll('.abas button').forEach(function(b){
    var v = b.getAttribute('data-v');
    var ativo = (v === S.view) || (v === 'ranking' && (S.view === 'busca' || S.view === 'cand'));
    /* aria-current e o que a navegacao realmente entrega; role=tab prometia painel que nao existe */
    if(ativo) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  var hh = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh + 'px');
}

/* ---------- blocos reutilizados ---------- */
function esqueleto(n){
  var h = '';
  for(var i=0;i<(n||6);i++) h += '<div class="sk"><i></i><i></i><i></i></div>';
  return '<div class="cartao" aria-busy="true"><p class="status">Carregando os dados</p>' + h + '</div>';
}
function painelErro(msg, acao){
  return '<div class="cartao"><div class="erro"><p>' + esc(msg) + '</p>' +
    '<button class="bt pri" data-act="' + (acao || 'retry') + '">Tentar de novo</button></div></div>';
}
function barras(itens, total, opts){
  opts = opts || {};
  if(!itens.length) return '<p class="vazio">Nada declarado por aqui até agora.</p>';
  var max = itens[0][1] || 1;
  return '<ul class="blist">' + itens.map(function(it, i){
    var larg = Math.max(2, Math.round(it[1] / max * 100));
    var linha = '<span>' + esc(it[0]) + '</span><b>' + moeda(it[1]) +
      (total ? ' <span class="c" style="color:var(--mut);font-weight:400">' + pct(it[1], total) + '%</span>' : '') + '</b>';
    var corpo = opts.acao
      ? '<button class="t" data-act="' + opts.acao + '" data-v="' + esc(it[2]) + '" title="' + esc(moedaCheia(it[1])) + '">' + linha + '</button>'
      : '<div class="t" title="' + esc(moedaCheia(it[1])) + '">' + linha + '</div>';
    var cur = (opts.acao && String(it[2]) === String(S.tipo)) ? ' aria-current="true"' : '';
    return '<li' + cur + '>' + corpo + '<div class="bar"><i style="width:' + larg + '%"></i></div></li>';
  }).join('') + '</ul>';
}

/* ---------- visão: ranking ---------- */
/* Uma frase em portugues antes dos numeros: quem chega precisa saber o que esta vendo. */
function fraseDoRecorte(n, comGasto, ct, pg, pb){
  if(!n) return '';
  var outroFiltro = !!(S.partido || S.fed || S.sinal || S.tipo !== '');
  var onde = esc(ondeUF(S.uf)), f;
  var verbo = (comGasto === 1 ? ' já declarou gasto' : ' já declararam gasto');
  if(S.cargo){
    f = 'Entre as <b>' + inteiro(n) + '</b> candidatura' + (n === 1 ? '' : 's') + ' a ' +
      esc(cargoCurto(META.cargos[S.cargo] || '')) + ' ' + onde + (outroFiltro ? ' neste recorte' : '') +
      ', <b>' + inteiro(comGasto) + '</b>' + verbo;
  } else {
    f = (outroFiltro ? 'Neste recorte ' + onde : onde.charAt(0).toUpperCase() + onde.slice(1)) +
      ', <b>' + inteiro(comGasto) + '</b> ' + (n === 1 ? 'da' : 'das') + ' <b>' + inteiro(n) +
      '</b> candidatura' + (n === 1 ? '' : 's') + verbo;
  }
  f += ', somando <b>' + moeda(ct) + '</b> contratados';
  if(pb == null) f += '. Os números por candidatura estão carregando.';
  else f += pg > 0 ? ', e <b>' + pct(pb, pg) + ' %</b> do que já foi pago saiu de dinheiro público.'
                   : ', e nada foi declarado como pago até agora.';
  return '<div class="abre">' + f + '</div>';
}
function blocoResumo(lista){
  var u = META.ufs[S.uf] || {};
  var temLista = !!UFD;
  var n = temLista ? lista.length : (u.n || 0);
  var ct = 0, pg = 0, pb = 0, rc = 0, sn = 0, semMov = 0, comGasto = 0;
  if(temLista){
    lista.forEach(function(r){
      ct += r[6]; pg += r[7]; rc += r[8]; pb += r[9]; sn += r[12].length;
      if(r[6] === 0 && r[8] === 0) semMov++;
      if(r[6] > 0) comGasto++;
    });
  } else {
    ct = u.contratado || 0; pg = u.pago || 0; rc = u.receita || 0; sn = u.alarmes || 0;
    comGasto = u.com_gasto || 0; pb = null;
  }
  var h = '<div class="cartao"><h2 class="ocultavisual">Resumo do recorte em ' + esc(S.uf) + '</h2>';
  h += fraseDoRecorte(n, comGasto, ct, pg, pb);
  h += '<div class="tiles">';
  h += '<div class="tile"><div class="r">Contratado</div><div class="v num" title="' + esc(moedaCheia(ct)) + '">' + moeda(ct) + '</div>' +
       '<div class="n">' + inteiro(n) + ' candidatura' + (n === 1 ? '' : 's') + '</div></div>';
  h += '<div class="tile"><div class="r">Já pago</div><div class="v num" title="' + esc(moedaCheia(pg)) + '">' + moeda(pg) + '</div>' +
       '<div class="n">' + pct(pg, ct) + '% do contratado</div></div>';
  if(temLista){
    h += '<div class="tile pub"><div class="r">Dinheiro público</div><div class="v num" title="' + esc(moedaCheia(pb)) + '">' + pct(pb, pg) + '%</div>' +
         '<div class="n">' + moeda(pb) + ' do que foi pago</div></div>';
  } else {
    h += '<div class="tile"><div class="r">Receita</div><div class="v num">' + moeda(rc) + '</div><div class="n">declarada</div></div>';
  }
  h += '<div class="tile sin"><div class="r">Sinais</div><div class="v num">' + inteiro(sn) + '</div>' +
       '<div class="n">' + (temLista ? 'para conferir' : 'na UF') + '</div></div>';

function blocoTipos(lista){

  });

  itens.sort(function(a,b){ return b[1] - a[1]; });

     fechar sozinho o que a pessoa acabou de abrir */

  var vis = itens.slice(0, 8);

    '<summary>Gasto por tipo · ' + itens.length + ' tipos · toque para filtrar</summary>' +

    h += '<div style="padding:0 12px 10px"><button class="bt" data-act="todostipos">Ver os ' + itens.length + ' tipos</button></div>';

/* A lista e cortada em dois lugares (tamanho do arquivo e codigo que so vale na ficha).
   Esconder o corte faria a lista parecer o conjunto inteiro, que e o contrario do que
   este painel existe para fazer. */
function notaCorte(filtrado){
  if(!ALA) return '';
  var n = ALA.a.length;
  var total = (typeof ALA.total === 'number') ? ALA.total : n;
  var cortados = (typeof ALA.cortados === 'number') ? ALA.cortados : Math.max(0, total - n);
  var p = [];
  if(cortados > 0){
    p.push('Esta lista mostra os <b>' + inteiro(n) + '</b> sinais de maior intensidade e maior valor, de <b>' +
      inteiro(total) + '</b>. Os outros <b>' + inteiro(cortados) + '</b> ficaram fora por limite de tamanho ' +
      'do arquivo e continuam na ficha de cada candidatura.');
  }
  var soma = 0;
  for(var uf in META.ufs) soma += (META.ufs[uf].alarmes || 0);
  var fora = soma - total;
  if(fora > 0){
    p.push('Outros <b>' + inteiro(fora) + '</b> sinais não entram nesta lista nacional e aparecem apenas na ' +
      'ficha da candidatura, ao lado do resto dos números dela.');
  }
  if(filtrado) p.push('A contagem acima é a do filtro que está ligado, não a do total.');
  return p.length ? '<div class="nota">' + p.join(' ') + '</div>' : '';
}

/* ---------- visão: ficha ---------- */
function serieSVG(serie){
  if(!serie.length) return '';
  var max = 0; serie.forEach(function(d){ if(d[1] > max) max = d[1]; });
  var n = serie.length, pw = 6, gap = 2, largura = n * (pw + gap);
  var barras = serie.map(function(d, i){
    var alt = max > 0 ? Math.max(1, Math.round(d[1] / max * 74)) : 1;
    return '<rect x="' + (i * (pw + gap)) + '" y="' + (78 - alt) + '" width="' + pw + '" height="' + alt + '"></rect>';
  }).join('');
  return '<svg class="serie" viewBox="0 0 ' + largura + ' 80" preserveAspectRatio="none" role="img" ' +
    'aria-label="Gasto declarado por dia, de ' + esc(dataBR(serie[0][0])) + ' a ' + esc(dataBR(serie[n-1][0])) + '">' +
    barras + '</svg>';
}
/* A comparacao com quem disputa o mesmo cargo na mesma UF. E o unico numero da ficha
   que responde 'isso e muito?'. Sem o bloco pares no JSON, a secao nao aparece. */
function blocoPares(f){
  var p = f.pares;
  if(!p || !p.grupo_n || !p.mediana) return '';
  var cargo = String(f.cargo || 'mesmo cargo').toLowerCase();
  var fr = '<b>' + esc(f.nome) + '</b> contratou <b>' + moeda(f.contratado) + '</b>. ' +
    'Entre as <b>' + inteiro(p.grupo_n) + '</b> candidaturas a ' + esc(cargo) + ' ' + esc(ondeUF(f.uf)) +
    ' que declararam gasto, a mediana é <b>' + moeda(p.mediana) + '</b>';
  if(p.vezes_a_mediana) fr += ', ou seja, <b>' + nm(p.vezes_a_mediana) + ' vezes a mediana</b>';
  fr += '.';
  if(p.fatia_do_grupo) fr += ' Esta candidatura responde por <b>' + nm(p.fatia_do_grupo) + ' %</b> de tudo que o grupo contratou.';
  /* regua: mediana e p90 ancoram a escala, o ponto marca onde esta a candidatura */
  var teto = Math.max(p.p90 || 0, p.mediana, f.contratado) || 1;
  var pos = function(v){ return Math.max(0, Math.min(100, v / teto * 100)); };
  var regua = '<div class="rv" aria-hidden="true"><div class="eixo"></div>' +
    '<div class="mc" style="left:' + pos(p.mediana) + '%"></div>' +
    (p.p90 ? '<div class="mc" style="left:' + pos(p.p90) + '%"></div>' : '') +
    '<div class="eu" style="left:calc(' + pos(f.contratado) + '% - 6px)"></div></div>' +
    '<div class="leg"><span>mediana ' + moeda(p.mediana) + '</span>' +
    (p.p90 ? '<span>p90 ' + moeda(p.p90) + '</span>' : '') + '</div>';
  return '<div class="pares"><div class="fr">' + fr + '</div>' + regua +
    '<div class="rs">A comparação é só entre quem disputa o mesmo cargo no mesmo estado e já declarou gasto. ' +
    'Gastar mais ou menos que o grupo não é irregularidade: é contexto para ler o número, e vale conferir na fonte.</div></div>';
}

      '<div class="tile sin"><div class="r">Sinais</div><div class="v num">' + inteiro(f.alarmes.length) + '</div><div class="n">para conferir</div></div>' +
      '</div>';
    if(f.pago > 0){
      h += '<div class="dest"><div class="g num">' + pubPct + '% público</div>' +
        '<div class="d">' + moeda(f.pago_publico) + ' dos ' + moeda(f.pago) + ' já pagos saíram de fundo eleitoral ou fundo partidário. ' +
        'Receita pública declarada: ' + moeda(f.receita_publica) + '.</div>' +
        '<div class="bar p" style="margin-top:8px" aria-hidden="true"><i style="width:' + pubPct + '%"></i></div></div>';
    }
    h += blocoPares(f);
  }
  h += '<div style="padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="bt" data-act="copiar">Copiar o link desta ficha</button></div></div>';

  h += '<div class="fgrid" style="margin-top:10px">';
  if(f.alarmes.length){
    h += '<div class="cartao full"><div class="cab"><h2>Sinais para conferir</h2><span style="font-size:11px;color:var(--mut)">' + f.alarmes.length + '</span></div>' +
      f.alarmes.map(function(a){
        return '<div class="sinal"><div class="top"><span class="selo" data-g="' + a.grav + '" aria-hidden="true">' + esc(a.cod) + '</span>' +
          pontos(a.grav) + '<span class="grav">· ' + esc(FAMS[a.cod.charAt(0)] || '') + '</span></div>' +
          '<div class="tx">' + esc(a.texto) + '</div>' +
          '<button class="nao" data-act="aviso" data-cod="' + esc(a.cod) + '">o que isso não significa ›</button></div>';
      }).join('') + '</div>';
  } else {
    h += '<div class="cartao full"><div class="nota">Nenhum sinal automático nesta candidatura até agora. ' +
      'Isso não é selo de aprovação: só quer dizer que nenhum dos padrões conferidos apareceu no que foi declarado.</div></div>';
  }
  if(f.tipos.length){
    h += '<div class="cartao"><div class="cab"><h2>Em que gastou</h2></div>' + barras(f.tipos, f.contratado) + '</div>';

  if(f.origens.length || f.fontes.length){
    h += '<div class="cartao"><div class="cab"><h2>De onde veio o dinheiro</h2></div>' +
      (f.origens.length ? barras(f.origens, f.receita) : '') +
      (f.fontes.length ? '<div class="cab" style="border-top:1px solid var(--b)"><h2>Fonte do recurso pago</h2></div>' + barras(f.fontes, f.pago) : '') +
      '</div>';
  }
  if(f.forn.length){
    h += '<div class="cartao full"><div class="cab"><h2>Quem recebeu</h2>' +
      '<span style="font-size:11px;color:var(--mut)">' + inteiro(f.n_forn) + ' fornecedores no total</span></div>' +
      f.forn.map(function(x){
        var selos = (x[6] || []).map(function(c){
          return '<button class="selo" data-act="aviso" data-cod="' + esc(c) + '" aria-label="Sinal ' + esc(c) + ', ver o que significa">' + esc(c) + '</button>';
        }).join(' ');
        return '<div class="forn"><div class="n1"><span class="nm">' + esc(x[1] || 'sem nome') + '</span>' +
          '<b class="num" title="' + esc(moedaCheia(x[2])) + '">' + moeda(x[2]) + '</b></div>' +
          '<div class="n2"><span class="tag' + (x[4] ? ' pj' : '') + '">' + (x[4] ? 'empresa' : 'pessoa física') + '</span>' +
          '<span>' + esc(x[0]) + '</span><span>' + inteiro(x[3]) + ' lançamento' + (x[3] === 1 ? '' : 's') + '</span>' +

      }).join('') +
      (f.n_forn > f.forn.length ? '<div class="nota">Mostrando os ' + f.forn.length + ' maiores de ' + inteiro(f.n_forn) + '.</div>' : '') +
      '</div>';
  }
  if(f.doadores.length){
    h += '<div class="cartao full"><div class="cab"><h2>Quem doou</h2></div>' +
      f.doadores.map(function(x){
        return '<div class="forn"><div class="n1"><span class="nm">' + esc(x[1] || 'sem nome') + '</span>' +
          '<b class="num" title="' + esc(moedaCheia(x[2])) + '">' + moeda(x[2]) + '</b></div>' +
          '<div class="n2"><span>' + esc(x[0]) + '</span><span>' + inteiro(x[3]) + ' doação' + (x[3] === 1 ? '' : 'ões') + '</span>' +
          (x[4] ? '<span>' + esc(x[4]) + '</span>' : '') + '</div></div>';
      }).join('') + '</div>';
  }
  if(f.serie.length){
    var maior = f.serie.slice().sort(function(a,b){ return b[1] - a[1]; })[0];
    h += '<div class="cartao full"><div class="cab"><h2>Ritmo do gasto declarado</h2></div>' + serieSVG(f.serie) +
      '<div class="nota">De <b>' + esc(dataBR(f.serie[0][0])) + '</b> a <b>' + esc(dataBR(f.serie[f.serie.length-1][0])) + '</b>. ' +
      'Maior dia: <b>' + moeda(maior[1]) + '</b> em ' + esc(dataBR(maior[0])) + '. ' +
      'O gráfico segue a data do lançamento, e a prestação de contas é entregue aos poucos.</div>' +
      '<details><summary>ver os números dia a dia</summary><div class="kv">' +
      f.serie.map(function(d){ return '<span class="k">' + esc(dataBR(d[0])) + '</span><span class="v num">' + moeda(d[1]) + '</span>'; }).join('') +
      '</div></details></div>';
  }
  h += '</div>';
  m.innerHTML = h;
}

/* ---------- carregadores ---------- */
var cacheFicha = Object.create(null), ordemFicha = [];
function guardarFicha(sq, d){
  cacheFicha[sq] = d; ordemFicha.push(sq);
  while(ordemFicha.length > 40){
    var velho = ordemFicha.shift();
    if(ordemFicha.indexOf(velho) < 0){ delete cacheFicha[velho]; delete cache['cand/' + velho + '.json']; }
  }
}
/* Confere uma vez se os dicionarios do meta cobrem os ids do arquivo da UF. Fora de
   sincronia, o partido some da linha e o filtro nunca casa: melhor dizer isso na tela. */
function conferirDicionarios(d){
  var maior = {partido:-1, fed:-1, tipo:-1, alarme:-1};
  d.c.forEach(function(r){
    if(r[3] > maior.partido) maior.partido = r[3];
    if(r[5] > maior.fed) maior.fed = r[5];
    r[11].forEach(function(t){ if(t[0] > maior.tipo) maior.tipo = t[0]; });
    r[12].forEach(function(a){ if(a[0] > maior.alarme) maior.alarme = a[0]; });
  });
  var faltam = [];
  Object.keys(maior).forEach(function(k){
    var dic = (META.dic && META.dic[k]) || [];
    if(maior[k] >= dic.length) faltam.push(k);
  });
  avisoDic = faltam.length
    ? 'Os arquivos de dados estão fora de sincronia (' + faltam.join(', ') + '). Alguns rótulos podem ' +
      'aparecer em branco e alguns filtros podem não encontrar tudo. Os valores em dinheiro não são afetados.'
    : '';
}
function carregarUF(){
  var uf = S.uf;
  UFD = null; erros.uf = null; ufEmVoo = uf;
  limparCacheUF(uf);
  get('uf/' + uf + '.json').then(function(d){
    if(ufEmVoo === uf) ufEmVoo = '';
    if(S.uf !== uf) return;
    UFD = d; conferirDicionarios(d); render();
  })['catch'](function(){
    if(ufEmVoo === uf) ufEmVoo = '';
    if(S.uf !== uf) return;
    erros.uf = 1; render();
  });
}
function carregarIndice(){
  if(IDX || carregarIndice.ocupado) return;
  carregarIndice.ocupado = true;
  get('indice.json').then(function(d){
    IDX = d; carregarIndice.ocupado = false; erros.indice = null;
    if(S.view === 'busca') render();
  })['catch'](function(){
    carregarIndice.ocupado = false;
    if(S.view === 'busca'){ erros.indice = 1; render(); }
  });
}
function carregarAlarmes(){
  if(ALA || carregarAlarmes.ocupado) return;
  carregarAlarmes.ocupado = true;
  get('alarmes.json').then(function(d){
    ALA = d; carregarAlarmes.ocupado = false; erros.alarmes = null;
    if(S.view === 'alarmes') render();
  })['catch'](function(){
    carregarAlarmes.ocupado = false;
    if(S.view === 'alarmes'){ erros.alarmes = 1; render(); }
  });
}
function carregarForn(){
  if(FOR || carregarForn.ocupado) return;
  carregarForn.ocupado = true;
  get('fornecedores.json').then(function(d){
    FOR = d; carregarForn.ocupado = false; erros.forn = null;
    if(S.view === 'fornecedores') render();
  })['catch'](function(){
    carregarForn.ocupado = false;
    if(S.view === 'fornecedores'){ erros.forn = 1; render(); }
  });
}
function carregarCota(){
  if(COTA || carregarCota.ocupado) return;
  carregarCota.ocupado = true;
  get('cota.json').then(function(d){
    COTA = d; carregarCota.ocupado = false; erros.cota = null;
    if(S.view === 'fornecedores') render();
  })['catch'](function(){
    carregarCota.ocupado = false;
    if(S.view === 'fornecedores'){ erros.cota = 1; render(); }
  });
}
function carregarFicha(){
  var sq = S.cand;
  if(!sq || carregarFicha.ocupado === sq) return;
  carregarFicha.ocupado = sq;
  get('cand/' + sq + '.json').then(function(d){
    guardarFicha(sq, d); carregarFicha.ocupado = null;
    if(S.cand === sq){ erros.cand = null; render(); }
  })['catch'](function(e){
    carregarFicha.ocupado = null;
    if(S.cand === sq){ erros.cand = (e && e.status === 404) ? 404 : 1; render(); }
  });
}

/* ---------- render ---------- */
function render(){
  if(!META) return;
  renderChips();
  var chave = S.view + '|' + S.cand + '|' + S.fo;
  var m = document.getElementById('conteudo');
  if(S.view === 'cand') viewCand();
  else if(S.view === 'busca') viewBusca();
  else if(S.view === 'alarmes') viewAlarmes();
  else if(S.view === 'fornecedores') viewFornecedores();
  else viewRanking();
  var det = document.getElementById('dettipos');
  if(det) det.addEventListener('toggle', function(){ tiposAberto = det.open; });
  var q = document.getElementById('q');
  if((document.activeElement !== q || primeiroRender) && q.value !== S.q) q.value = S.q;
  primeiroRender = false;
  document.getElementById('limpaq').classList.toggle('ocul', !q.value);
  if(chave !== ultimaChave){ window.scrollTo(0,0); ultimaChave = chave; }
}

/* ---------- cliques ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var a = t.getAttribute('data-act');
  if(a === 'fecharfolha'){ fecharFolha(); return; }
  if(a === 'aviso'){ e.preventDefault(); abrirAviso(t.getAttribute('data-cod')); return; }
  if(a === 'ajuda'){ abrirAjuda(); return; }
  if(a === 'opt'){
    var k = t.getAttribute('data-k'), v = t.getAttribute('data-v'), p = {};
    fecharFolha();
    if(S.view === 'cand' || S.view === 'busca'){ p.view = 'ranking'; p.cand = ''; p.q = ''; }
    /* trocar de UF aqui nao precisa de caso especial: o render confere se o arquivo
       carregado e o da UF pedida, venha ela do clique ou do hash */
    p[k] = v; ir(p); return;
  }
  if(a === 'aba'){
    var v2 = t.getAttribute('data-v');
    if(v2 === 'ranking') ir({view:'ranking', q:'', cand:''});
    else ir({view:v2, q:'', cand:''});
    return;
  }
  if(a === 'fo'){ ir({view:'fornecedores', fo:t.getAttribute('data-v')}); return; }
  if(a === 'mais'){ S.limite += 60; render(); focarNovaLinha(); return; }
  if(a === 'limpar'){
    ir(S.view === 'alarmes' ? {grav:'', fam:'', auf:''} : {cargo:'', partido:'', fed:'', sinal:'', tipo:'', ord:'contratado'});
    return;
  }
  if(a === 'limpatipo'){ ir({tipo:''}); return; }
  if(a === 'tipo'){ var nt = t.getAttribute('data-v'); ir({tipo: String(nt) === String(S.tipo) ? '' : nt}); return; }
  if(a === 'todostipos'){ abrirTodosTipos(); return; }
  if(a === 'porreceita'){ ir({view:'ranking', ord:'receita', fo:'valor'}); return; }
  if(a === 'voltar'){ if(history.length > 1) history.back(); else ir({view:'ranking', cand:'', q:''}); return; }
  if(a === 'limpaq'){ document.getElementById('q').value = ''; ir({q:'', view:'ranking'}); document.getElementById('q').focus(); return; }
  if(a === 'copiar'){ copiarLink(t); return; }
  if(a === 'retry'){ render(); return; }
  if(a === 'retryuf'){ erros.uf = null; carregarUF(); render(); return; }
  if(a === 'retryidx'){ erros.indice = null; carregarIndice(); render(); return; }
  if(a === 'retryala'){ erros.alarmes = null; ALA = null; carregarAlarmes(); render(); return; }
  if(a === 'retryfor'){ erros.forn = null; FOR = null; carregarForn(); render(); return; }
  if(a === 'retrycota'){ erros.cota = null; COTA = null; carregarCota(); render(); return; }
  if(a === 'retrycand'){ erros.cand = null; carregarFicha(); render(); return; }
  if(a.indexOf('f-') === 0){ abrirFiltro(a.slice(2)); return; }
});
function focarNovaLinha(){
  var l = document.querySelectorAll('.rowmain, .sinal');
  var alvo = l[Math.max(0, S.limite - 60)];
  if(alvo && alvo.focus) alvo.focus();
}
function copiarLink(bt){
  var url = location.href, antes = bt.textContent;
  var ok = function(){ bt.textContent = 'Link copiado'; setTimeout(function(){ bt.textContent = antes; }, 1800); };
  var mostrar = function(){ abrirFolha('Link desta tela', '<p>' + esc(url) + '</p>'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok)['catch'](mostrar);
  } else {
    mostrar();
  }
}

/* ---------- folhas de filtro ---------- */
function contarPor(fn, ignorar){
  var m = {};
  if(!UFD) return m;
  UFD.c.forEach(function(r){ if(passa(r, ignorar)){ var k = fn(r); m[k] = (m[k]||0) + 1; } });
  return m;
}
function abrirFiltro(qual){
  if(!META) return;   /* o botao existe desde o primeiro instante; o dicionario nao */
  if(qual === 'uf'){
    var itens = Object.keys(META.ufs).sort().map(function(u){
      var o = META.ufs[u];
      return {v:u, r:u, c:inteiro(o.n) + ' cand. · ' + moeda(o.contratado)};
    });
    abrirFolha('Estado', opcoes('uf', itens, S.uf));
  } else if(qual === 'cargo'){
    var cc = contarPor(function(r){ return r[4]; }, 'cargo');
    var it = [{v:'', r:'Todos os cargos', c: UFD ? inteiro(UFD.c.length) : ''}];
    Object.keys(META.cargos).forEach(function(k){
      if(UFD && !cc[k]) return;
      it.push({v:k, r:META.cargos[k], c: cc[k] ? inteiro(cc[k]) : '0'});
    });
    abrirFolha('Cargo', opcoes('cargo', it, S.cargo));
  } else if(qual === 'partido'){
    var cp = contarPor(function(r){ return META.dic.partido[r[3]]; }, 'partido');
    var ip = [{v:'', r:'Todos os partidos', c:''}];
    META.dic.partido.slice().sort().forEach(function(p){
      if(UFD && !cp[p]) return;
      ip.push({v:p, r:p, c: cp[p] ? inteiro(cp[p]) : '0'});
    });
    abrirFolha('Partido', opcoes('partido', ip, S.partido));
  } else if(qual === 'fed'){
    var cf = contarPor(function(r){ return META.dic.fed[r[5]] || ''; }, 'fed');
    var iff = [{v:'', r:'Todas as federações', c:''}];
    META.dic.fed.forEach(function(f){
      if(!f) return;
      if(UFD && !cf[f]) return;
      iff.push({v:f, r:f, c: cf[f] ? inteiro(cf[f]) : '0'});
    });
    abrirFolha('Federação', opcoes('fed', iff, S.fed));
  } else if(qual === 'ord'){
    abrirFolha('Ordenar por', opcoes('ord', Object.keys(ORDS).map(function(k){ return {v:k, r:ORDS[k]}; }), S.ord));
  } else if(qual === 'sinal'){
    var cs = {};
    if(UFD) UFD.c.forEach(function(r){ if(passa(r,'sinal')) codigosDaLinha(r).forEach(function(c){ cs[c] = (cs[c]||0)+1; }); });
    var isx = [{v:'', r:'Todas as candidaturas', c:''}, {v:'com', r:'Só as que têm algum sinal', c:''}];
    Object.keys(FAMS).forEach(function(f){ isx.push({v:f, r:'Família ' + f + ' · ' + FAMS[f], c:''}); });
    META.dic.alarme.forEach(function(c){ isx.push({v:c, r:c + ' · ' + resumoCod(c), c: cs[c] ? inteiro(cs[c]) : '0'}); });
    abrirFolha('Sinais', opcoes('sinal', isx, S.sinal));
  } else if(qual === 'grav'){
    abrirFolha('Intensidade do sinal', opcoes('grav', [
      {v:'', r:'Todas'}, {v:'3', r:'3 de 3'}, {v:'2', r:'2 de 3'}, {v:'1', r:'1 de 3'}
    ], S.grav));
  } else if(qual === 'fam'){
    var ifa = [{v:'', r:'Todas as famílias', c:''}];
    Object.keys(FAMS).forEach(function(f){ ifa.push({v:f, r:'Família ' + f + ' · ' + FAMS[f], c:''}); });
    META.dic.alarme.forEach(function(c){ ifa.push({v:c, r:c + ' · ' + resumoCod(c), c:''}); });
    abrirFolha('Família do sinal', opcoes('fam', ifa, S.fam));
  } else if(qual === 'auf'){
    var iu = [{v:'', r:'Todas as UFs', c:''}];
    Object.keys(META.ufs).sort().forEach(function(u){ iu.push({v:u, r:u, c: inteiro(META.ufs[u].alarmes || 0) + ' sinais'}); });
    abrirFolha('Estado', opcoes('auf', iu, S.auf));
  }
}
function resumoCod(cod){
  var s = sinalDe(cod);
  if(!s) return 'explicação não disponível nesta versão dos dados';
  var t = (s.nome || s.significa).trim();
  return t.length > 64 ? t.slice(0,62) + '…' : t;
}
function abrirTodosTipos(){
  var lista = filtradas(), soma = {}, total = 0;
  lista.forEach(function(r){ r[11].forEach(function(t){ soma[t[0]] = (soma[t[0]]||0) + t[1]; total += t[1]; }); });
  var itens = Object.keys(soma).map(function(k){ return [META.dic.tipo[+k] || 'sem tipo', soma[k], k]; });
  itens.sort(function(a,b){ return b[1] - a[1]; });
  abrirFolha('Gasto por tipo', '<p class="rot">Toque em um tipo para filtrar o ranking</p>' +
    '<div style="padding:0 2px">' + barras(itens, total, {acao:'tipo'}) + '</div>');
}
function abrirAjuda(){
  if(!META) return;   /* sem dicionario nao ha ajuda a montar, e o clique nao pode quebrar em silencio */
  var cods = (META.dic && META.dic.alarme) || [];
  var c = '<p class="rot">O que é um sinal</p>' +
    '<p>Um sinal é um padrão calculado por máquina em cima do que a campanha declarou ao TSE. ' +
    'Ele aponta o que <b>vale conferir</b>. Não é acusação, não é irregularidade, não é conclusão sobre ninguém. ' +
    'Cada sinal traz junto o que ele <b>não</b> significa.</p>' +
    '<p class="rot">Os ' + cods.length + ' sinais</p>';
  cods.forEach(function(cod){
    c += '<button class="opt" data-act="aviso" data-cod="' + esc(cod) + '"><span><b>' + esc(cod) + '</b> · ' + esc(resumoCod(cod)) + '</span><span class="c">ver ›</span></button>';
  });
  c += '<p class="rot">Famílias</p><p>' + Object.keys(FAMS).map(function(f){ return f + ' ' + FAMS[f]; }).join(' · ') + '</p>';
  c += '<p class="rot">Atalhos de teclado</p>' +
    '<div class="tecla"><span>Ir para a busca</span><span><kbd>/</kbd></span></div>' +
    '<div class="tecla"><span>Navegar na lista</span><span><kbd>j</kbd> <kbd>k</kbd></span></div>' +
    '<div class="tecla"><span>Abrir o que está em foco</span><span><kbd>Enter</kbd></span></div>' +
    '<div class="tecla"><span>Ranking, sinais, dinheiro</span><span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span></div>' +
    '<div class="tecla"><span>Filtros</span><span><kbd>u</kbd> <kbd>c</kbd> <kbd>p</kbd> <kbd>f</kbd> <kbd>o</kbd> <kbd>s</kbd></span></div>' +
    '<div class="tecla"><span>Voltar, fechar</span><span><kbd>Esc</kbd></span></div>' +
    '<div class="tecla"><span>Esta ajuda</span><span><kbd>?</kbd></span></div>';
  c += '<p class="rot">Os dados</p><p>Prestação de contas da eleição de 2026, dados abertos do TSE, ' +
    'gerados em ' + esc(dataBR(META.tse.gerado || META.gerado_em)) + '. ' +
    'Última despesa declarada na base: ' + esc(dataBR(META.tse.data_max_despesa) || 'sem data') + '. ' +
    'Documentos de pessoa física já chegam mascarados e não são reconstruídos aqui.</p>';
  c += '<p class="rot">Contestar ou corrigir</p>' +
    '<p>Quem aparece aqui, candidatura ou fornecedor, pode pedir correção. O caminho é abrir um registro ' +
    'público no repositório do projeto, em <a href="' + REPO + '/issues" rel="noopener" target="_blank">' +
    esc(REPO.replace('https://github.com/','github.com/')) + '/issues</a>. ' +
    'Correção aceita é publicada junto com o dado corrigido, e o registro do pedido fica aberto à vista.</p>' +
    '<p>O cálculo de cada sinal (a regra, o limiar e a janela de dados) está no mesmo repositório, em ' +
    '<b>pipeline/alarmes/</b>, e o código que monta esta tela está em <b>site/index.html</b>. ' +
    'Nada aqui é feito à mão: o que estiver errado no dado de origem pode ser conferido na fonte, no TSE.</p>' +
    '<p class="rot">Esta tela</p><p style="word-break:break-all">' + esc(location.href) + '</p>' +
    '<p><button class="bt" data-act="copiar">Copiar o link desta tela</button></p>';
  abrirFolha('Como ler este painel', c);
}

/* ---------- busca ---------- */
var tq = null;
var campoQ = document.getElementById('q');
campoQ.addEventListener('input', function(){
  carregarIndice();
  clearTimeout(tq);
  tq = setTimeout(function(){
    var v = campoQ.value.trim();
    document.getElementById('limpaq').classList.toggle('ocul', !v);
    if(v === S.q) return;
    if(!v){ ir({q:'', view:'ranking'}, 'substituir'); return; }
    ir({q:v, view:'busca', cand:''}, 'substituir');
  }, 140);
});
campoQ.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ campoQ.value = ''; ir({q:'', view:'ranking'}, 'substituir'); campoQ.blur(); }
  if(e.key === 'Enter'){
    e.preventDefault();
    var p = document.querySelector('#conteudo .rowmain');
    if(p) p.focus();
  }
});

/* ---------- teclado ---------- */
document.addEventListener('keydown', function(e){
  if(folhaAberta()) return;
  var alvo = e.target, tag = alvo.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || alvo.isContentEditable) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key;
  if(k === '/' ){ e.preventDefault(); campoQ.focus(); campoQ.select(); return; }
  if(k === '?'){ e.preventDefault(); abrirAjuda(); return; }
  if(k === 'Escape'){ if(S.view === 'cand'){ e.preventDefault(); history.back(); } return; }
  if(k === 'j' || k === 'k'){
    var l = Array.prototype.slice.call(document.querySelectorAll('#conteudo .rowmain[href], #conteudo .sinal a'));
    if(!l.length) return;
    e.preventDefault();
    var i = l.indexOf(document.activeElement);
    var n = k === 'j' ? (i < 0 ? 0 : Math.min(l.length-1, i+1)) : (i < 0 ? 0 : Math.max(0, i-1));
    l[n].focus();
    l[n].scrollIntoView({block:'nearest'});
    return;
  }
  if(k === '1'){ ir({view:'ranking', q:'', cand:''}); return; }
  if(k === '2'){ ir({view:'alarmes', q:'', cand:''}); return; }
  if(k === '3'){ ir({view:'fornecedores', q:'', cand:''}); return; }
  if(S.view === 'alarmes'){
    if(k === 'u'){ abrirFiltro('auf'); return; }
    if(k === 'g'){ abrirFiltro('grav'); return; }
    if(k === 'f'){ abrirFiltro('fam'); return; }
  } else {
    if(k === 'u'){ abrirFiltro('uf'); return; }
    if(k === 'c'){ abrirFiltro('cargo'); return; }
    if(k === 'p'){ abrirFiltro('partido'); return; }
    if(k === 'f'){ abrirFiltro('fed'); return; }
    if(k === 'o'){ abrirFiltro('ord'); return; }
    if(k === 's'){ abrirFiltro('sinal'); return; }
  }
});
window.addEventListener('resize', function(){
  var hh = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh + 'px');
});

/* ---------- início ---------- */
function iniciar(){
  document.getElementById('conteudo').innerHTML = esqueleto(7);
  aplicarHash();
  get('meta.json').then(function(d){
    META = d;
    if(!META.ufs[S.uf]) S.uf = Object.keys(META.ufs)[0];
    document.getElementById('dtger').textContent = dataBR(META.tse.gerado || META.gerado_em) || 'sem data';
    document.getElementById('btajuda').disabled = false;
    document.getElementById('btajuda2').disabled = false;
    carregarUF();          /* o render ja cobre isso, mas comecar o fetch aqui adianta a primeira tela */
    render();
    if(S.view === 'busca') carregarIndice();
  })['catch'](function(){
    document.getElementById('conteudo').innerHTML =
      '<div class="cartao"><div class="erro"><p>Não foi possível carregar os dados do painel. ' +
      'Verifique a conexão e tente de novo.</p><button class="bt pri" data-act="reiniciar">Tentar de novo</button></div></div>';
  });
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act="reiniciar"]');
  if(t) iniciar();
});
iniciar();
})();
</script>
