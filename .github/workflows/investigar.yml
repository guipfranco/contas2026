name: investigar o modelo de dados

on:
  workflow_dispatch:
    inputs:
      uf:
        description: UF das medicoes
        default: AC
      fixture:
        description: UF a congelar como fixture
        default: RR

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m ferramentas.investigar --uf "${{ inputs.uf }}" --fixture "${{ inputs.fixture }}" --saida-fixture fixture
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-${{ inputs.fixture }}
          path: fixture/
          retention-days: 30
