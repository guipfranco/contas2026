name: rodada diaria

# Baixa a prestacao de contas do TSE, recalcula tudo e republica o site.
# Duas vezes por dia porque a hora em que o TSE regenera os arquivos nao e
# anunciada: o observado em 17/09 foi por volta das 04h de Brasilia.

on:
  # O agendamento ficou pausado de 18/09 a 05/10, enquanto a tela nova era fechada,
  # e voltou a pedido do dono: o site passou o fim do primeiro turno parado no que
  # foi publicado a mao em 21/09. Para pausar de novo, comente os dois cron; o
  # disparo manual continua valendo nos dois casos. Depois de 01/12/2026 o job
  # `agenda`, abaixo, pula sozinho a rodada agendada.
  schedule:
    - cron: '30 9 * * *'    # 06:30 em Brasilia
    - cron: '0 15 * * *'    # 12:00 em Brasilia
  workflow_dispatch:
    inputs:
      ufs:
        description: so estas UFs (vazio = o pais inteiro)
        default: ''
      sem_receita:
        description: pular a consulta a Receita
        type: boolean
        default: false
      publicar:
        description: publicar no Pages
        type: boolean
        default: true

concurrency:
  group: rodada
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # O agendamento vale ate 01/12/2026, inclusive. A prestacao final fechou em
  # 03/11 para quem disputou so o 1o turno e fecha em 14/11 para quem foi ao 2o
  # (Lei 9.504/1997, art. 29, III e IV). A folga cobre o zip que o TSE regenera
  # na manha seguinte e a conta entregue atrasada ou retificada. Depois disso a
  # rodada agendada aparece como pulada, sem publicar e sem e-mail de falha; o
  # disparo manual roda sempre. Para estender, mude ULTIMO_DIA.
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.data.outputs.rodar }}
    steps:
      - id: data
        env:
          EVENTO: ${{ github.event_name }}
          ULTIMO_DIA: '2026-12-01'
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%F)
          if [ "$EVENTO" = schedule ] && [[ "$hoje" > "$ULTIMO_DIA" ]]; then
            echo "agendamento encerrado em $ULTIMO_DIA (hoje e $hoje em Brasilia): nada roda"
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

  construir:
    needs: agenda
    if: needs.agenda.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - name: buscar o estado das rodadas anteriores
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dados
          path: estado-repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: testes
        run: python -m unittest discover -s tests -v

      - name: preparar estado
        run: |
          mkdir -p estado
          if [ -d estado-repo/estado ]; then cp -r estado-repo/estado/. estado/; fi
          ls -la estado/ || true

      - name: rodada
        env:
          # A chave que protege o CPF: o identificador publico de fornecedor
          # pessoa fisica e um HMAC com ela. Sem ela, essas fichas simplesmente
          # nao sao escritas, e a rodada avisa alto. Crie o secret com:
          #   gh secret set CONTAS_SAL --body "<uma frase longa e aleatoria>"
          CONTAS_SAL: ${{ secrets.CONTAS_SAL }}
        run: |
          python -m pipeline.rodar \
            --site site/dados \
            --estado estado \
            --tmp "$RUNNER_TEMP/tse" \
            --ufs "${{ inputs.ufs }}" \
            ${{ inputs.sem_receita && '--sem-receita' || '' }}

      - name: conferir o que vai ao ar
        run: python -m pipeline.validar site/dados

      - id: decidir
        run: echo "publicar=${{ github.event_name == 'schedule' || inputs.publicar }}" >> "$GITHUB_OUTPUT"

      - name: guardar o estado
        continue-on-error: true
        run: |
          cd estado-repo || exit 0
          rm -rf estado
          cp -r ../estado .
          git config user.name "rodada automatica"
          git config user.email "noreply@github.com"
          git add -A
          git diff --quiet --cached || git commit -m "estado de $(date -I)"
          git pull --rebase --autostash origin dados || true
          git push origin HEAD:dados

      - uses: actions/upload-pages-artifact@v3
        if: steps.decidir.outputs.publicar == 'true'
        with:
          path: site

  publicar:
    needs: construir
    if: needs.construir.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
